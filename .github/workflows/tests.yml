name: 영월캠프 자동 테스트

on:
  pull_request:
    branches: [main]
  push:
    branches: [fix-scheduler-20261102]
    paths:
      - 'monitor.py'
      - 'healthcheck.py'
      - 'tests/**'
      - '.github/workflows/**'

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 3
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install requests beautifulsoup4
      - name: 문법 검사
        run: python -m compileall -q monitor.py healthcheck.py tests
      - name: 회귀 테스트
        env:
          TELEGRAM_BOT_TOKEN: test_token
          TELEGRAM_CHAT_ID: test_chat
        run: python -m unittest discover -s tests -v
