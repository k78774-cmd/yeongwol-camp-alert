name: 영월캠프 예약 확인

on:
  # GitHub 자체 cron은 지연·누락될 수 있으므로 외부 무료 스케줄러로
  # workflow_dispatch를 추가 호출할 수 있게 유지한다.
  schedule:
    - cron: '2 * * * *'
  workflow_dispatch:
  # 소스가 반영되면 한 번 즉시 검증한다. 상태 파일 커밋은 재실행하지 않는다.
  push:
    branches: [main]
    paths:
      - 'monitor.py'
      - '.github/workflows/main.yml'

permissions:
  contents: write

# 수동·외부·기본 예약 실행의 중복 겹침을 방지한다.
concurrency:
  group: yeongwol-camp-monitor
  cancel-in-progress: false

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 4

    steps:
      - name: 코드 가져오기
        uses: actions/checkout@v4

      - name: Python 설정
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: 필요한 프로그램 설치
        run: python -m pip install requests beautifulsoup4

      - name: 기본 동작 테스트
        run: python -m unittest discover -s tests -v
        env:
          TELEGRAM_BOT_TOKEN: test_token
          TELEGRAM_CHAT_ID: test_chat

      - name: 예약 확인 실행
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          GITHUB_TOKEN: ${{ github.token }}
          GITHUB_REPOSITORY: ${{ github.repository }}
        run: python monitor.py
